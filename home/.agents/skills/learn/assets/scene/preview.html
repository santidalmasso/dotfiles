<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene preview</title>
<!-- Open as preview.html?scene=path/a.js,path/b.js (paths relative to this file). Optional &engine=path/engine.js. Tokens mirror references/page-template.html. -->
<style>
:root{--ground:#f7f8f6;--ink:#161a17;--text-2:#4a514c;--muted:#7f8781;--faint:#c2c8c3;--rule:#e4e8e4;--well:#edf0ec;--card:#ffffff;--accent:#2f5d8a;--accent-soft:#e6eef6;--card-shadow:0 0 0 1px rgb(0 0 0/.05),0 1px 2px rgb(0 0 0/.04),0 2px 6px rgb(0 0 0/.04);--font-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-serif:"Iowan Old Style","EB Garamond",Georgia,serif;--font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--ease:cubic-bezier(.22,.75,.2,1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ground:#111412;--ink:#e7ebe8;--text-2:#b2b9b4;--muted:#848c86;--faint:#4b524d;--rule:#262b28;--well:#1b1f1c;--card:#171b18;--accent:#86afdb;--accent-soft:#1a2633;--card-shadow:0 0 0 1px rgb(255 255 255/.07),0 1px 2px rgb(0 0 0/.3);color-scheme:dark}}
:root[data-theme="dark"]{--ground:#111412;--ink:#e7ebe8;--text-2:#b2b9b4;--muted:#848c86;--faint:#4b524d;--rule:#262b28;--well:#1b1f1c;--card:#171b18;--accent:#86afdb;--accent-soft:#1a2633;--card-shadow:0 0 0 1px rgb(255 255 255/.07),0 1px 2px rgb(0 0 0/.3);color-scheme:dark}
body{margin:0;padding:32px 16px;background:var(--ground);color:var(--ink);font-family:var(--font-sans);font-size:14px}
main{max-width:660px;margin:0 auto}
</style>
<link rel="stylesheet" href="scene.css">
</head>
<body>
<main></main>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const load = (src) => new Promise((ok, fail) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => fail(new Error("cannot load " + src)); document.head.appendChild(s); });
  await load(q.get("engine") || "engine.js");
  const names = [];
  const define = Scene.define;
  Scene.define = (name, def) => { names.push(name); define(name, def); };
  for (const src of (q.get("scene") || "example-rowsToPivot.js").split(",")) await load(src);
  const main = document.querySelector("main");
  names.forEach((name) => { const f = document.createElement("figure"); f.dataset.scene = name; main.appendChild(f); Scene.mount(f); });
})();
</script>
</body>
</html>
